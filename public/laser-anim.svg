<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" class="w-full h-full">
  <defs>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6634" stop-opacity="0">
        <animate attributeName="offset" values="0;0;0.6;1" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ff6634" stop-opacity="1">
        <animate attributeName="offset" values="0.4;0.5;0.8;0.9" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff6634" stop-opacity="0">
        <animate attributeName="offset" values="0.8;1;1;1" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a3a" />
      <stop offset="100%" stop-color="#1a1a2a" />
    </linearGradient>

    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6634" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff6634" stop-opacity="0" />
    </linearGradient>

    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sparkGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Metal Plate -->
  <g transform="translate(80, 100)">
    <rect x="0" y="0" width="440" height="280" rx="4" fill="url(#plateGrad)" stroke="#3a3a4a" stroke-width="1.5" />

    <!-- Plate surface texture lines -->
    <line x1="0" y1="40" x2="440" y2="40" stroke="#333345" stroke-width="0.5" opacity="0.5" />
    <line x1="0" y1="80" x2="440" y2="80" stroke="#333345" stroke-width="0.5" opacity="0.5" />
    <line x1="0" y1="120" x2="440" y2="120" stroke="#333345" stroke-width="0.5" opacity="0.5" />
    <line x1="0" y1="160" x2="440" y2="160" stroke="#333345" stroke-width="0.5" opacity="0.5" />
    <line x1="0" y1="200" x2="440" y2="200" stroke="#333345" stroke-width="0.5" opacity="0.5" />
    <line x1="0" y1="240" x2="440" y2="240" stroke="#333345" stroke-width="0.5" opacity="0.5" />

    <!-- Cut path (the line being cut) -->
    <path d="M 40,240 C 120,240 160,200 200,160 C 240,120 280,100 320,80 C 360,60 380,50 400,40"
          fill="none" stroke="#ff6634" stroke-width="1.5"
          stroke-dasharray="600" stroke-dashoffset="600" filter="url(#glowFilter)">
      <animate attributeName="stroke-dashoffset" from="600" to="0" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Cut gap (wider dark line following the cut) -->
    <path d="M 40,240 C 120,240 160,200 200,160 C 240,120 280,100 320,80 C 360,60 380,50 400,40"
          fill="none" stroke="#ff6634" stroke-width="6" opacity="0.15"
          stroke-dasharray="600" stroke-dashoffset="600">
      <animate attributeName="stroke-dashoffset" from="600" to="0" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Glow trail behind cut -->
    <path d="M 40,240 C 120,240 160,200 200,160 C 240,120 280,100 320,80 C 360,60 380,50 400,40"
          fill="none" stroke="url(#glow)" stroke-width="20"
          stroke-dasharray="600" stroke-dashoffset="600">
      <animate attributeName="stroke-dashoffset" from="600" to="0" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Laser head (moving along the path) -->
    <g>
      <animateMotion dur="4s" repeatCount="indefinite" rotate="auto"
        path="M 40,240 C 120,240 160,200 200,160 C 240,120 280,100 320,80 C 360,60 380,50 400,40" />

      <!-- Laser head body -->
      <rect x="-10" y="-20" width="20" height="16" rx="3" fill="#224da8" stroke="#1a3a8a" stroke-width="1" />

      <!-- Nozzle -->
      <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#555" />

      <!-- Laser beam -->
      <line x1="0" y1="4" x2="0" y2="30" stroke="url(#beam)" stroke-width="3" filter="url(#glowFilter)" />
      <line x1="0" y1="4" x2="0" y2="30" stroke="#ff8844" stroke-width="1" opacity="0.8" />
    </g>

    <!-- Sparks -->
    <g filter="url(#sparkGlow)">
      <circle cx="0" cy="0" r="1.5" fill="#ffcc44">
        <animateMotion dur="4s" repeatCount="indefinite"
          path="M 40,240 C 120,240 160,200 200,160 C 240,120 280,100 320,80 C 360,60 380,50 400,40" />
        <animate attributeName="cx" values="0;10;-8;6;-12" dur="0.3s" repeatCount="indefinite" />
        <animate attributeName="cy" values="0;-6;4;-10;8" dur="0.25s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1;0;1" dur="0.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="1" fill="#ff8844">
        <animateMotion dur="4s" repeatCount="indefinite"
          path="M 40,240 C 120,240 160,200 200,160 C 240,120 280,100 320,80 C 360,60 380,50 400,40" />
        <animate attributeName="cx" values="0;-6;8;-4;10" dur="0.35s" repeatCount="indefinite" />
        <animate attributeName="cy" values="0;-8;5;-12;6" dur="0.3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0;1;0;1;0" dur="0.25s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="1" fill="#ff6634">
        <animateMotion dur="4s" repeatCount="indefinite"
          path="M 40,240 C 120,240 160,200 200,160 C 240,120 280,100 320,80 C 360,60 380,50 400,40" />
        <animate attributeName="cx" values="0;12;-10;8;-6" dur="0.4s" repeatCount="indefinite" />
        <animate attributeName="cy" values="0;4;-8;6;-10" dur="0.3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1;0" dur="0.3s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Already cut section (thin orange line marking completed path) -->
    <path d="M 40,240"
          fill="none" stroke="#ff6634" stroke-width="2" opacity="0.4">
      <animate attributeName="d"
        values="M 40,240;M 40,240 C 120,240 160,200 200,160 C 240,120 280,100 320,80 C 360,60 380,50 400,40;M 40,240 C 120,240 160,200 200,160 C 240,120 280,100 320,80 C 360,60 380,50 400,40"
        dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Molten metal drip effects along cut -->
    <circle cx="200" cy="162" r="0" fill="#ff6634" opacity="0">
      <animate attributeName="r" values="0;0;3;3;0" dur="1.5s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0;0.6;0.6;0" dur="1.5s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="162;162;162;172;172" dur="1.5s" begin="1.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="320" cy="82" r="0" fill="#ff6634" opacity="0">
      <animate attributeName="r" values="0;0;2.5;2.5;0" dur="1.5s" begin="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0;0.5;0.5;0" dur="1.5s" begin="2.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="82;82;82;92;92" dur="1.5s" begin="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Corner accents -->
  <rect x="60" y="80" width="20" height="3" rx="1.5" fill="#ff6634" opacity="0.6" />
  <rect x="60" y="80" width="3" height="20" rx="1.5" fill="#ff6634" opacity="0.6" />
  <rect x="520" y="80" width="20" height="3" rx="1.5" fill="#224da8" opacity="0.6" />
  <rect x="517" y="80" width="3" height="20" rx="1.5" fill="#224da8" opacity="0.6" />
  <rect x="60" y="400" width="20" height="3" rx="1.5" fill="#224da8" opacity="0.6" />
  <rect x="60" y="383" width="3" height="20" rx="1.5" fill="#224da8" opacity="0.6" />
  <rect x="520" y="400" width="20" height="3" rx="1.5" fill="#ff6634" opacity="0.6" />
  <rect x="517" y="383" width="3" height="20" rx="1.5" fill="#ff6634" opacity="0.6" />
</svg>
